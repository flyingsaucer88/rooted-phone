# AUTHORITATIVE copy of the phone-resident SEO tracker's domain config.
#
# Deployed to the phone at ~/seo_tracker/phone/config.yaml. It lives here (rather
# than only on the device) because the device copy silently drifted from
# site_monitor/config/sites.yaml — v2x and ai were live and monitored by neither.
# tests/test_site_inventory.py now guards both files against that drift.
#
# Deploy:  scp -i ~/.ssh/id_moto_playground -P 8022 phone/seo_tracker_config.yaml \
#            u0_a122@127.0.0.1:seo_tracker/phone/config.yaml
# Ambimat ecosystem SEO tracker — PHONE (crawl-only) config.
#
# Used by ../phone_seo.py. Pure data: no OAuth, no Search Console, no keys.
# This is the phone-friendly counterpart to the desktop config.py — the domain
# definitions mirror config.example.py's MULTI_DOMAIN_CONFIG so the analyses
# (clusters, topical authority, cannibalisation) behave the same, minus GSC.

domains:
  - name: Ambimat
    slug: ambimat
    domain: ambimat.com
    site_url: https://ambimat.com/
    sitemap_url: https://ambimat.com/sitemap.xml
    seed_keywords:
      - IoT solutions
      - Embedded systems
      - Electronics manufacturing
      - OEM electronics
      - Industrial IoT
      - Smart devices
      - Hardware design
    primary_clusters:
      - IoT identity / OEM

