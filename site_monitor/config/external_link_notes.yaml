# External-link verification notes.
#
# WHAT THIS IS. A record of what we learned when a link could not be verified, so the next
# reader does not re-investigate the same URL from scratch. Every entry here was confirmed by
# hand on the date given.
#
# WHAT THIS IS NOT. It is not an allowlist, an ignore-list or an exemption. A note is attached
# to a record that the crawler has ALREADY decided is unverified, on live evidence, in this run.
# It cannot move a link out of `unverified_external`, cannot stop one entering
# `broken_external`, and cannot keep one out of the staleness ledger. If a noted URL answers
# 200 on the next run it is simply not recorded as unverified at all, and the note never
# applies. If it starts answering 404/410/5xx, or its redirect lands on a not-found page, it
# becomes a broken link exactly as it would without a note.
#
# The only thing a note changes is whether the report says
#   "unverified — known anti-bot, confirmed 2026-09-09"
# or
#   "unverified — NEW / unclassified"
# which is the difference between a finding someone has already judged and one nobody has.
#
# classes:
#   antibot           third party serves browsers but refuses automated clients
#   transient         failed once, verified healthy on manual retest
#   upstream-failure  the remote host itself is down or resetting; URL believed correct
#
# Adding an entry requires evidence: an actual manual check on the date recorded.

notes:
