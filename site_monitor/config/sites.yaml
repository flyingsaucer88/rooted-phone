# Ambimat Site Monitor — site list and crawl policy.
# Public-crawl-based compromise indicator + SEO health report.
# See site_monitor/README.md for the accuracy limitation (this cannot prove
# "a hack was attempted in the last 24h" — only surface indicators visible on public pages).

sites:
  - name: Ambimat
    base_url: https://ambimat.com
  - name: AmbiSecure
    base_url: https://ambisecure.ambimat.com
  - name: AmbiAutomation
    base_url: https://ambiautomation.ambimat.com
  - name: Ambimat eSIM
    base_url: https://esim.ambimat.com
  - name: AmbiPower
    base_url: https://ambipower.ambimat.com
  - name: Orders
    base_url: https://orders.ambimat.com
  - name: RoboRacer
    base_url: https://roboracer.ambimat.com
  - name: V2X
    base_url: https://v2x.ambimat.com
  - name: AI Tools
    base_url: https://ai.ambimat.com

crawl:
  # FULL COVERAGE (approved 2026-07-27): crawl every crawlable internal page per site.
  # Largest site (ambimat.com) has ~697 sitemap pages, so the cap is set well above that.
  max_pages_per_site: 800
  # Per-request timeout as (connect, read). request_timeout_seconds kept as a fallback.
  request_timeout_seconds: 10
  connect_timeout_seconds: 5
  read_timeout_seconds: 10
  # 0.5s keeps the crawl polite while making full coverage (~1170 pages across 9 sites) feasible.
  delay_between_requests_seconds: 0.5
  user_agent: "RootedPhoneSiteMonitor/0.1 (+Ambimat internal monitoring)"
  respect_robots_txt: true
  use_sitemap: true
  check_external_links: true
  max_external_links_per_site: 20
  max_internal_link_checks_per_site: 300
  # Time budgets raised so full coverage is NOT truncated, while still bounding a hung run.
  # ambimat ~697 pages @0.5s ≈ 6 min + link checks → 20 min/site ceiling; 60 min whole-run ceiling.
  max_seconds_per_site: 1200
  global_max_seconds: 3600
  # Always write partial reports and flush progress so a slow run is observable.
  write_partial_reports: true
  progress_flush: true
  # Skip obviously non-HTML assets by extension (still recorded as links, not crawled).
  skip_extensions:
    - .jpg
    - .jpeg
    - .png
    - .gif
    - .svg
    - .webp
    - .ico
    - .css
    - .js
    - .pdf
    - .zip
    - .gz
    - .mp4
    - .mp3
    - .woff
    - .woff2
    - .ttf
    - .eot
    - .xml
  # Don't download bodies larger than this (bytes) — protects phone memory.
  max_body_bytes: 3000000

alerts:
  fail_on_status_codes: [400, 401, 403, 404, 410, 429, 500, 502, 503, 504]
  # Spam-domain labels. Matched against the EXTERNAL link host's DOT-SEPARATED LABELS, whole
  # label only — NOT as a free substring. 2026-09-08: substring matching flagged two legitimate
  # industry sources as suspicious domains — "pharma" inside pharmaceuticalcommerce.com and
  # "crypto" inside cryptomathic.com (an EMV key-management vendor). On a payments/cryptography
  # site those substrings appear in ordinary vendor names, so whole-label matching is the only
  # workable rule. A genuine spam injection points at casino.example / buy-viagra.example,
  # whose labels still match.
  suspicious_external_domains:
    - casino
    - pharma
    - viagra
    - loan
    - crypto
    - porn
    - adult
  # TLS certificate warning threshold.
  cert_expiry_warn_days: 21
  # How long a link may stay UNVERIFIED before a human is asked to look at it.
  #
  # Classifying an anti-bot 403 as "not broken" is correct and must not turn into "trusted
  # for ever": a page that genuinely disappears behind a WAF would otherwise sit in the
  # unverified bucket permanently with nobody re-checking it. Every unverified URL carries the
  # date it first failed, and at this age the monitor warns. Verifying on any later run drops
  # it from the ledger and restarts the clock, so this is a re-verification schedule rather
  # than an allowlist, and it cannot be satisfied by leaving things alone.
  unverified_stale_days: 30
  # External social/CDN hosts that commonly reject bot HEAD/GET (return None/403) — do NOT
  # report these as "broken external links" (they are false positives, not site problems).
  # Matched on the host SUFFIX at a dot boundary, so "facebook.com" also covers
  # www.facebook.com and "linkedin.com" covers in.linkedin.com. (2026-09-08: this was an exact
  # netloc match, so every www./country-subdomain form slipped past the list and five social
  # links were reported unverified every single run.)
  external_check_skip_hosts:
    - twitter.com
    - x.com
    - facebook.com
    - linkedin.com
    - instagram.com
    - youtube.com
    - youtu.be
    # Share-widget endpoint, not site content: /add_to/email 302s to a mailto: URL and
    # /add_to/<network> rate-limits automated clients. Checking it measures AddToAny's
    # bot policy, never whether the Orders site is healthy.
    - addtoany.com
  # THE IFRAME INVARIANT.
  #
  # This list is the whole security model for frames on the estate: "only these origins may be
  # embedded". It is not an exemption list and must not be treated as one. A frame from a host
  # that is NOT here raises an ALERT, not a warning — an unexplained third-party frame appearing
  # on a page is one of the clearest signatures of an injection, and the only way that signal
  # stays meaningful is if the expected set is small, explicit and reviewed.
  #
  # Adding a host here is a decision to trust it with a frame on our pages. Do it deliberately,
  # with the reason, in the group it belongs to.
  #
  # Matched on the host suffix at a dot boundary, so "google.com" covers www.google.com but
  # never google.com.evil.tld.
  expected_iframe_hosts:
    # --- Group 1: site infrastructure we deploy on purpose -------------------
    - googletagmanager.com      # GTM/GA4 <noscript> frame, on every page of several sites
    - google.com                # reCAPTCHA challenge frame on the contact forms
    - gstatic.com               # reCAPTCHA static assets
    - maps.google.com           # embedded office location maps
    - youtube.com               # product/《how-to》 video embeds
    - youtube-nocookie.com
    - youtu.be
    - vimeo.com
    - openstreetmap.org
    # --- Group 2: publisher oEmbeds approved editorially (ambimat.com) --------
    # Each is an industry source quoted in a specific article. Reviewed 2026-09-08: every one
    # was confirmed to still serve its embed. Two more were removed in the same review because
    # their remotes were dead (digitalid.co.uk 500, emv-connection.com Cloudflare 522) — those
    # articles now carry plain reference links instead of a broken frame.
    - paylosophy.com            # /emv-certification-in-a-nutshell/
    - pcisecuritystandards.org  # /pci-ssc-data-security-standards-overview/, /official-pci-...-libary/
    - encryptionconsulting.com  # /triple-des-or-3des/
    - tech-faq.com              # /data-layout-on-magnetic-stripe-cards/
    - idtechproducts.com        # /how-to-parse-tlvs-in-javascript/
    - idwholesaler.com          # /whats-the-difference-between-a-hico-loco-magstripe-card/

security_headers:
  # Headers we check for presence on each site's homepage (missing = warning, not alert).
  - content-security-policy
  - x-frame-options
  - x-content-type-options
  - referrer-policy
  - strict-transport-security
