# Ambimat ecosystem SEO tracker — PHONE (crawl-only) config.
#
# Used by ../phone_seo.py. Pure data: no OAuth, no Search Console, no keys.
# This is the phone-friendly counterpart to the desktop config.py — the domain
# definitions mirror config.example.py's MULTI_DOMAIN_CONFIG so the analyses
# (clusters, topical authority, cannibalisation) behave the same, minus GSC.

domains:
  - name: Ambimat
    slug: ambimat
    domain: ambimat.com
    site_url: https://ambimat.com/
    sitemap_url: https://ambimat.com/sitemap.xml
    seed_keywords:
      - IoT solutions
      - Embedded systems
      - Electronics manufacturing
      - OEM electronics
      - Industrial IoT
      - Smart devices
      - Hardware design
    primary_clusters:
      - IoT identity / OEM

  - name: AmbiSecure
    slug: ambisecure
    domain: ambisecure.ambimat.com
    site_url: https://ambisecure.ambimat.com/
    sitemap_url: https://ambisecure.ambimat.com/sitemap.xml
    seed_keywords:
      - FIDO2
      - WebAuthn
      - Passkeys
      - PIV
      - JavaCard
      - Secure Elements
      - ePassport
      - PKI
      - X.509
      - DESFire
      - SCP03
      - APDU
      - IoT Security
      - Device Identity
      - Passwordless Authentication
    primary_clusters:
      - FIDO / WebAuthn / Passkeys
      - PIV / FIPS 201 / Smart card
      - JavaCard / GlobalPlatform
      - Secure Elements / MFF2 / Embedded SE
      - PKI / X.509 / PKCS
