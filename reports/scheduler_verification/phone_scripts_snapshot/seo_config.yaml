# Crawl politeness + phone-safety budgets. Keep max pages modest on a 2016
# device; the crawler is polite and bounded either way.
crawl:
  max_pages_per_domain: 800   # FULL COVERAGE (approved 2026-07-27); largest site ~697 pages
  request_timeout_seconds: 15
  delay_between_requests_seconds: 0.5
  user_agent: "Ambimat-SEO-Tracker-Phone/1.0 (+https://ambimat.com; daily crawl-only)"
